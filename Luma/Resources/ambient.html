<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050a13}canvas{width:100%;height:100%}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d'); let paused=false, t=0, last=0;
window.wallpaperPropertyListener={setPaused:p=>paused=p};
function draw(now){requestAnimationFrame(draw); if(paused)return; if(now-last<33)return; t+=(now-last>1000?33:now-last)/1000;last=now;
const d=Math.min(devicePixelRatio||1,2),w=innerWidth,h=innerHeight;if(c.width!==Math.round(w*d)||c.height!==Math.round(h*d)){c.width=Math.round(w*d);c.height=Math.round(h*d)}g.setTransform(d,0,0,d,0,0);g.fillStyle='#050912';g.fillRect(0,0,w,h);g.globalCompositeOperation='screen';
for(let i=0;i<5;i++){const x=w*(.15+i*.19+Math.sin(t*.08+i)*.12),y=h*(.45+Math.sin(t*.1+i*1.6)*.28),r=Math.max(w,h)*(.32+i*.025);const a=g.createRadialGradient(x,y,0,x,y,r);a.addColorStop(0,`hsla(${LUMA_HUE+i*17},80%,${24+i*2}%,.48)`);a.addColorStop(.45,`hsla(${LUMA_HUE+i*13},80%,20%,.12)`);a.addColorStop(1,'transparent');g.fillStyle=a;g.fillRect(0,0,w,h)}g.globalCompositeOperation='source-over';
for(let i=0;i<95;i++){const x=((Math.sin(i*134.7)*.5+.5)*w+t*(i%3+.3)*1.5)%w,y=((Math.cos(i*79.3)*.5+.5)*h+t*.7)%h;g.globalAlpha=.08+.17*(Math.sin(t*.3+i)*.5+.5);g.fillStyle='#c1f7ed';g.fillRect(x,y,i%4===0?2:1,1)}g.globalAlpha=1}
requestAnimationFrame(draw);
</script></body></html>
